<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="430" viewBox="0 0 1280 430" role="img" aria-labelledby="ttl desc">
<title id="ttl">Pooja Kiran, Security Engineer</title>
<desc id="desc">Futuristic isometric security-system mesh illustrating the boundaries between agents, workload identities, and model artifacts.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07101e"/><stop offset="0.65" stop-color="#0a1728"/><stop offset="1" stop-color="#050b16"/></linearGradient>
<linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2b94b2" stop-opacity=".62"/><stop offset=".45" stop-color="#103e67" stop-opacity=".22"/><stop offset="1" stop-color="#407bd4" stop-opacity=".46"/></linearGradient>
<radialGradient id="glow"><stop stop-color="#4bd8e4" stop-opacity=".3"/><stop offset="1" stop-color="#4bd8e4" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="46" height="46" patternUnits="userSpaceOnUse"><path d="M 46 0 L 0 0 0 46" fill="none" stroke="#4a7994" stroke-opacity=".08"/></pattern>
<filter id="blur"><feGaussianBlur stdDeviation="5"/></filter>
<filter id="drop"><feDropShadow dx="0" dy="15" stdDeviation="20" flood-color="#30dbed" flood-opacity=".15"/></filter>
<style>
.trace {stroke-dasharray:8 12;animation:flow 16s linear infinite}
.pulse {animation:pulse 4s ease-in-out infinite;transform-origin:990px 212px}
.orbit {transform-origin:984px 212px;animation:turn 46s linear infinite}
.orbit2 {transform-origin:984px 212px;animation:turn 65s linear infinite reverse}
.breathe {animation:breathe 5s ease-in-out infinite}
@keyframes flow {to{stroke-dashoffset:-200}}
@keyframes pulse {50% {opacity:.25;transform:scale(1.08)}}
@keyframes breathe {50%{opacity:.55}}
@keyframes turn{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.trace,.pulse,.orbit,.orbit2,.breathe{animation:none}}
</style></defs>
<rect width="1280" height="430" rx="16" fill="url(#bg)"/><rect width="1280" height="430" fill="url(#grid)"/>
<path d="M0 354 L680 354" stroke="#70cae8" opacity=".22"/><path d="M0 356 L680 356" stroke="#132c44" opacity=".8"/>
<g opacity=".17" stroke="#2b85a6"><path d="M725 0L1170 430M815 0L1260 430M905 0L1280 360M1190 0L720 430" /></g>
<rect x="58" y="58" width="4" height="295" rx="2" fill="#42bad6"/>
<text x="88" y="112" fill="#7cc8df" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="4">SECURITY ENGINEERING</text>
<text x="88" y="192" fill="#eff7fe" font-family="Arial, Helvetica, sans-serif" font-size="55" font-weight="700" letter-spacing="-1.4">POOJA KIRAN</text>
<text x="89" y="238" fill="#a7ccde" font-family="Arial, Helvetica, sans-serif" font-size="23">Agent Security  /  Application Security  /  Cloud IAM</text>
<text x="90" y="279" fill="#cadce6" font-family="Arial, Helvetica, sans-serif" font-size="17">Engineering controls where software gains authority.</text>
<text x="90" y="309" fill="#8bafc3" font-family="Arial, Helvetica, sans-serif" font-size="15">Identity.  Capability.  Authorization.  Execution.  Evidence.</text>
<text x="89" y="381" fill="#587f97" font-family="monospace" font-size="15" letter-spacing=".8">PYTHON    MCP / JSON-RPC    IAM    MODEL PROVENANCE</text>
<circle cx="984" cy="212" r="198" fill="url(#glow)" class="breathe"/>
<g stroke="#45aace" stroke-width="1.5" fill="none" opacity=".54">
<ellipse cx="984" cy="212" rx="220" ry="85" transform="rotate(-24 984 212)" class="orbit"/>
<ellipse cx="984" cy="212" rx="205" ry="65" transform="rotate(28 984 212)" class="orbit2"/>
<path d="M769 212H1197 M984 18V404" stroke-dasharray="3 10" opacity=".25"/>
</g>
<g filter="url(#drop)">
<path d="M983 55 L1126 132 L1126 287 L983 364 L842 287 L842 132 Z" fill="#071e32" fill-opacity=".52" stroke="#55b7d3" stroke-width="2"/>
<path d="M983 55 L1126 132 L983 208 L842 132 Z" fill="url(#glass)" stroke="#5bdcf0" stroke-width="1.8"/>
<path d="M842 132 L983 208 L983 364 L842 287 Z" fill="#124563" fill-opacity=".54" stroke="#4bbdd4" stroke-width="1.5"/>
<path d="M1126 132 L983 208 L983 364 L1126 287 Z" fill="#12345f" fill-opacity=".68" stroke="#4bbdd4" stroke-width="1.5"/>
<path d="M983 115 L1071 163 L1071 259 L983 308 L895 259 L895 163 Z" fill="none" stroke="#69cddd" stroke-opacity=".46"/>
<path d="M983 115 L1071 163 L983 211 L895 163 Z" fill="#4bd8e4" fill-opacity=".12" stroke="#78e2e9" stroke-opacity=".55"/>
<path d="M983 211V308M895 163L983 211L1071 163" stroke="#78e2e9" opacity=".55" fill="none"/>
<g class="pulse" stroke="#7ce4ec" stroke-width="4" stroke-linejoin="round" fill="#102d47">
<path d="M983 160 l57 26 v59 c0 38-24 60-57 78 c-33-18-57-40-57-78 v-59 Z"/>
<path d="M962 231 l15 14 l30-35" fill="none" stroke="#a4faff" stroke-width="6" stroke-linecap="round"/>
</g></g>
<g stroke="#7bd9e9" stroke-width="2" opacity=".65" fill="none" class="trace">
<path d="M702 160 C778 160 808 132 841 132"/>
<path d="M1161 278 C1220 278 1243 310 1280 310"/>
<path d="M722 321 C794 321 798 287 841 287"/>
</g>
<g fill="#9ee5ea"><circle cx="748" cy="160" r="3"/><circle cx="1224" cy="296" r="3"/><circle cx="767" cy="306" r="3"/></g>
</svg>