<svg width="1200" height="300" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1220"/>
      <stop offset="0.55" stop-color="#111827"/>
      <stop offset="1" stop-color="#071018"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(820 88) rotate(145) scale(380 190)">
      <stop stop-color="#38BDF8" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="190" y1="0" x2="1010" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" stroke="#94A3B8" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>

  <rect width="1200" height="300" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="24" fill="url(#grid)"/>
  <rect width="1200" height="300" rx="24" fill="url(#glow)"/>

  <g opacity="0.9">
    <circle cx="102" cy="88" r="4" fill="#38BDF8">
      <animate attributeName="opacity" values="0.35;1;0.35" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1090" cy="214" r="4" fill="#34D399">
      <animate attributeName="opacity" values="1;0.35;1" dur="3.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1040" cy="64" r="3" fill="#A78BFA">
      <animate attributeName="r" values="3;6;3" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0.25;0.9" dur="3.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <rect x="210" y="70" width="780" height="2" rx="1" fill="url(#line)" opacity="0.35"/>
  <rect x="210" y="230" width="780" height="2" rx="1" fill="url(#line)" opacity="0.2"/>

  <g>
    <rect x="214" y="72" width="150" height="156" fill="#38BDF8" opacity="0.08">
      <animate attributeName="x" values="214;836;214" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.03;0.12;0.03" dur="8s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="600" y="126" text-anchor="middle" fill="#F8FAFC" font-size="46" font-weight="700" letter-spacing="4">POOJA KIRAN</text>
    <text x="600" y="164" text-anchor="middle" fill="#7DD3FC" font-size="18" font-weight="600" letter-spacing="5">AI SECURITY ENGINEER</text>
    <text x="600" y="198" text-anchor="middle" fill="#CBD5E1" font-size="15" letter-spacing="1.6">Agent Security • Application Security • Cloud IAM • Model Supply Chain</text>
  </g>

  <g opacity="0.75" stroke-linecap="round">
    <path d="M88 238H230" stroke="#38BDF8" stroke-width="2"/>
    <path d="M970 52H1112" stroke="#34D399" stroke-width="2"/>
    <circle cx="88" cy="238" r="5" fill="#38BDF8"/>
    <circle cx="1112" cy="52" r="5" fill="#34D399"/>
  </g>

  <rect x="1" y="1" width="1198" height="298" rx="23" stroke="#334155" stroke-opacity="0.75" stroke-width="2"/>
</svg>