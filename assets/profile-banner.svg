    <text x="65" y="189" font-size="19" font-weight="500" fill="#E2E8F0">AI Agents &amp; Application Security</text>
    <text x="65" y="249" font-size="15" fill="#94A3B8">Design authority. Verify execution. Preserve evidence.</text>
  </g>
  <g font-family="Segoe UI, Arial, sans-serif" font-weight="600" font-size="14" fill="#E2E8F0">
    <path d="M750 70V230" stroke="#38BDF8" stroke-opacity=".7" stroke-width="2" stroke-dasharray="5 8"/>
    <circle cx="750" cy="81" r="7" fill="#38BDF8"/><circle cx="750" cy="127" r="7" fill="#38BDF8"/>
    <circle cx="750" cy="173" r="7" fill="#5EEAD4"/><circle cx="750" cy="219" r="7" fill="#5EEAD4"/>
    <rect x="780" y="62" width="352" height="37" rx="9" fill="#17334B" stroke="#2E6784"/>
    <rect x="780" y="108" width="352" height="37" rx="9" fill="#17334B" stroke="#2E6784"/>
    <rect x="780" y="154" width="352" height="37" rx="9" fill="#173C41" stroke="#2B7770"/>
    <rect x="780" y="200" width="352" height="37" rx="9" fill="#173C41" stroke="#2B7770"/>
    <text x="801" y="87">AGENT</text><text x="944" y="87" fill="#93C5FD">→</text><text x="967" y="87">TOOL</text>
    <text x="801" y="133">IDENTITY</text><text x="944" y="133" fill="#93C5FD">→</text><text x="967" y="133">AUTHORITY</text>
    <text x="801" y="179">ARTIFACT</text><text x="944" y="179" fill="#99F6E4">→</text><text x="967" y="179">REVIEW</text>
    <text x="801" y="225">TELEMETRY</text><text x="944" y="225" fill="#99F6E4">→</text><text x="967" y="225">EVIDENCE</text>
