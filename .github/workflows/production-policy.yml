name: Documentation Integrity

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  documentation-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Reject unresolved placeholders and merge conflicts
        shell: python
        run: |
          from pathlib import Path

          candidates = [
              Path("README.md"), Path("SECURITY.md"), Path("PRODUCTION.md"),
              Path("SECURITY_CHECKLIST.md"), Path("SECURITY_AUDIT_2026-09-30.md"),
          ]
          forbidden = ("<<<<<<<", "=======", ">>>>>>>", "TODO: FILL", "TBD_METRIC")
          failures = []
          for path in candidates:
              if not path.is_file():
                  continue
              body = path.read_text(encoding="utf-8", errors="replace")
              for marker in forbidden:
                  if marker in body:
                      failures.append(f"{path}: unresolved marker {marker!r}")
          if failures:
              raise SystemExit("\n".join(failures))
          print("documentation integrity verified")
      - name: Verify repository security controls
        run: python scripts/security_scan.py
