name: Profile CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - name: Verify production/evidence surfaces
        run: python scripts/verify_profile.py
      - name: Verify dated recruiting metrics manifest
        run: python scripts/verify_metrics_manifest.py
      - name: Lint and format maintained Python scripts
        run: |
          python -m pip install ruff==0.8.4
          python -m ruff check scripts
          python -m ruff format --check scripts
      - name: Verify repository security controls
        run: python scripts/security_scan.py
