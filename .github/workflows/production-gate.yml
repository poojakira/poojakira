name: Production Gate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-evidence-index:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Reject unresolved placeholders and merge markers
        run: |
          python - <<'PY'
          from pathlib import Path
          bad = []
          markers = ("<<<<<<<", "=======", ">>>>>>>", "TODO: FILL", "TBD_METRIC")
          for p in Path(".").glob("*.md"):
              text = p.read_text(encoding="utf-8")
              for marker in markers:
                  if marker in text:
                      bad.append(f"{p}: {marker}")
          if bad:
              raise SystemExit("\n".join(bad))
          print("profile evidence documents contain no unresolved release placeholders")
          PY
      - name: Verify repository security controls
        run: python scripts/security_scan.py
