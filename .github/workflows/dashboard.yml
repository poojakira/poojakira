name: Evidence Dashboard

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validate claim registry
        run: python tools/validate_claims.py --max-age-days 90
      - name: Validate profile repository
        run: python -m pytest tests -q -ra -W error
      - name: Build dashboard
        run: python tools/build_security_dashboard.py
