name: Evidence Dashboard

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@0b93645e5fea7323368d4e411b0bb7e112d8a43f
        with:
          python-version: "3.12"
      - run: python tools/build_security_dashboard.py
