name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Clone selected public repositories
        run: |
          set -euo pipefail
          for repo in hf-model-provenance-scanner mcp-security-gateway-monitor llm-redteam-framework PulseNet-RUL-Forecasting dataset-poisoning-detector model-privacy-attacks adversarial-ml-lab; do
            git clone --depth 1 "https://github.com/poojakira/${repo}.git" "../${repo}"
          done

      - name: Validate profile repository
        run: python -m pytest tests -q -ra -W error

      - name: Build dashboard
        run: python tools/build_security_dashboard.py

      - name: Copy dashboard to docs
        run: |
          mkdir -p docs
          cp security-dashboard.html docs/index.html
          cp README.md docs/README.md
          cp RUNBOOK.md docs/RUNBOOK.md

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4